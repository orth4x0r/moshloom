name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    # Deliberately not the GPU suite: gpu_test.mjs drives Chromium against a real WebGPU
    # adapter, and the committed goldens are pinned to SwiftShader plus one specific
    # engine.wasm. That run stays local (`npm test`) or moves to a self-hosted runner on
    # the machine with the GPU. Everything that needs no GPU is checked here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: syntax check
        run: |
          for f in gpu.js gpu_test.mjs test.mjs scripts/*.mjs; do
            node --check "$f"
          done

      - name: CPU suite (wasm engine, 3840 frames, determinism replay)
        run: node test.mjs
