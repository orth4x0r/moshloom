[workspace]
resolver = "3"
members = [
  "crates/mosh-core",
  "crates/mosh-ipc",
  "crates/mosh-tap",
  "crates/mosh-capture",
  "crates/mosh-analysis",
  "crates/mosh-show",
  "crates/mosh-shaders",
  "crates/mosh-render",
  "crates/mosh-video",
  "crates/mosh-midi",
  "crates/mosh-als",
  "crates/mosh-visuals",
  "crates/mosh-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[profile.release]
debug = 1

# Twelve worktrees build at once on a 15 GB / 39 GB-free laptop: keep debug artifacts small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
