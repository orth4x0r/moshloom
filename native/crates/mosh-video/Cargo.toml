[package]
name = "mosh-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mosh-core = { path = "../mosh-core" }
# HAP sections are Snappy-compressed (the VJ standard's second-stage compressor).
snap = "1.1.2"

# The tests build their own HAP samples and `.mov` files, so they need an encoder too: there is
# no HAP encoder on the reference machine and media is never downloaded.
[dev-dependencies]
snap = "1.1.2"

# Media Foundation source reader (Task 1.11). Every call lives in `src/win.rs`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
