[package]
name = "mosh-tap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cdylib` for the VST3 bundle, `rlib` so the tests can call the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
mosh-core = { path = "../mosh-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
# The shared-memory writer (Task 1.1). Off until `mosh-ipc` lands; the plugins then
# behave as pure pass-throughs and write nothing.
mosh-ipc = { path = "../mosh-ipc", optional = true }

[features]
default = ["ipc"]
ipc = ["dep:mosh-ipc"]

[lints.rust]
# `vst3-com`'s vtable macro, expanded by `nih_plug::nih_export_vst3!()`, emits a trailing
# semicolon in expression position. The warning comes from the dependency, not from this crate.
semicolon_in_expressions_from_non_local_macros = "allow"
