[package]
name = "mosh-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Drives the offline harness through the live analysis (Analyzer, Task 1.3, and IntensityModel,
# Task 1.4). Off by default: those APIs are not on main yet, so the gate builds without them.
live-analysis = []

[dependencies]
mosh-core = { path = "../mosh-core" }
serde = { version = "1.0", features = ["derive"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "pcm", "wav"] }
toml = "0.8"

[[bin]]
name = "mosh-analyze"
path = "src/bin/mosh-analyze.rs"
