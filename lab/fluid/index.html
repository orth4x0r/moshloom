<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fluid lab - stable fluids on WebGPU</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #07080c; color: #cfd6e4;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body { display: grid; place-items: center; }
  #wrap { position: relative; }
  canvas {
    display: block; width: min(92vw, 1024px); height: auto; background: #05060a;
    border-radius: 2px; box-shadow: 0 0 0 1px #1b2030, 0 14px 44px #000a;
    touch-action: none; cursor: crosshair;
  }
  #hud {
    position: absolute; left: 10px; bottom: 10px;
    display: flex; gap: 14px; align-items: center;
    padding: 6px 10px; background: #05060ad9; border: 1px solid #1b2030;
    border-radius: 3px; backdrop-filter: blur(4px);
  }
  #hud b { font-weight: 600; color: #8fe3c4; font-variant-numeric: tabular-nums; }
  #hud .dim { color: #6b7688; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #8fe3c4; margin: 0; }
  #err { position: absolute; top: 10px; left: 10px; color: #ff8b8b; max-width: 66ch; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view" width="512" height="288"></canvas>
  <div id="hud">
    <span><b id="ms">--</b> <span class="dim">ms/step (avg 30)</span></span>
    <label><input type="checkbox" id="imgmode"><span class="dim">advect test image</span></label>
  </div>
  <div id="err"></div>
</div>

<script type="module">
// =============================================================================
//  Fluid - stable fluids solver.  One self-contained object, no page refs.
//  Public surface:  init(device) - step(encoder, forces) - velocityView -
//                   velocityTexture - reset() - W - H
// =============================================================================
const Fluid = {
  W: 256,
  H: 144,

  device: null,
  _src: 0,          // index of the current velocity texture
  _psrc: 0,         // index of the current pressure texture
  maxSplats: 8,

  get velocityView() { return this.view.vel[this._src]; },
  get velocityTexture() { return this.tex.vel[this._src]; },
  get pressureView() { return this.view.prs[this._psrc]; },

  async init(device) {
    this.device = device;
    const W = this.W, H = this.H;
    const USAGE = GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.STORAGE_BINDING |
                  GPUTextureUsage.COPY_SRC | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT;
    const mk = () => device.createTexture({ size: { width: W, height: H }, format: 'rgba16float', usage: USAGE });
    const vw = (t) => t.createView();

    this.tex = { vel: [mk(), mk()], prs: [mk(), mk()], div: mk(), curl: mk() };
    this.view = {
      vel: this.tex.vel.map(vw),
      prs: this.tex.prs.map(vw),
      div: vw(this.tex.div),
      curl: vw(this.tex.curl),
    };

    // linear filtering + clamp: semi-Lagrangian lookup, no wrap artefacts
    this.sampler = device.createSampler({
      magFilter: 'linear', minFilter: 'linear',
      addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    });

    const ubo = (bytes) => device.createBuffer({
      size: bytes, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    this.u = {
      advect: ubo(16),
      splat: ubo(16 + 16 * 16),
      vort: ubo(16),
      jacobi: ubo(16),
    };
    this._splatData = new Float32Array(4 + 16 * 4);
    this._advectData = new Float32Array(4);
    this._vortData = new Float32Array(4);

    this._writeStaticUniforms();

    const code = (body) => SH_HEADER
      .replaceAll('$W', String(W))
      .replaceAll('$H', String(H))
      .replaceAll('$MAXV', Number(this.maxSpeed).toFixed(1)) + body;
    const pipe = (body) => device.createComputePipelineAsync({
      layout: 'auto',
      compute: { module: device.createShaderModule({ code: code(body) }), entryPoint: 'main' },
    });

    const [advect, splat, curl, vort, div, jacobi, grad] = await Promise.all([
      pipe(WGSL_ADVECT), pipe(WGSL_SPLAT), pipe(WGSL_CURL), pipe(WGSL_VORT),
      pipe(WGSL_DIV), pipe(WGSL_JACOBI), pipe(WGSL_GRAD),
    ]);
    this.pip = { advect, splat, curl, vort, div, jacobi, grad };

    const bg = (p, entries) => device.createBindGroup({ layout: p.getBindGroupLayout(0), entries });
    const V = this.view.vel, P = this.view.prs;

    this.bg = {
      advect: [0, 1].map((s) => bg(advect, [
        { binding: 0, resource: V[s] },
        { binding: 1, resource: this.sampler },
        { binding: 2, resource: { buffer: this.u.advect } },
        { binding: 3, resource: V[1 - s] },
      ])),
      splat: [0, 1].map((s) => bg(splat, [
        { binding: 0, resource: V[s] },
        { binding: 1, resource: { buffer: this.u.splat } },
        { binding: 2, resource: V[1 - s] },
      ])),
      curl: [0, 1].map((s) => bg(curl, [
        { binding: 0, resource: V[s] },
        { binding: 1, resource: this.view.curl },
      ])),
      vort: [0, 1].map((s) => bg(vort, [
        { binding: 0, resource: V[s] },
        { binding: 1, resource: this.view.curl },
        { binding: 2, resource: { buffer: this.u.vort } },
        { binding: 3, resource: V[1 - s] },
      ])),
      div: [0, 1].map((s) => bg(div, [
        { binding: 0, resource: V[s] },
        { binding: 1, resource: this.view.div },
      ])),
      jacobi: [0, 1].map((p) => bg(jacobi, [
        { binding: 0, resource: P[p] },
        { binding: 1, resource: this.view.div },
        { binding: 2, resource: { buffer: this.u.jacobi } },
        { binding: 3, resource: P[1 - p] },
      ])),
      grad: [0, 1, 2, 3].map((k) => {
        const s = k >> 1, p = k & 1;
        return bg(grad, [
          { binding: 0, resource: V[s] },
          { binding: 1, resource: P[p] },
          { binding: 2, resource: V[1 - s] },
        ]);
      }),
    };

    this.reset();
    return this;
  },

  _writeStaticUniforms() {
    this.device.queue.writeBuffer(this.u.jacobi, 0, new Float32Array([0.25, 0, 0, 0]));
  },

  // ---- tunables (all in sim units) -----------------------------------------
  velocityDissipation: 0.999,
  vorticity: 6,
  pressureIterations: 20,
  maxSpeed: 3000,           // cells/second; also scrubs NaN/Inf

  /**
   * Encode one full simulation frame.
   * @param {GPUCommandEncoder} encoder
   * @param {{ dt:number, splats?: Array<{x:number,y:number,fx:number,fy:number,radius:number}> }} forces
   *        x,y in [0,1] with y up. fx,fy in cells/second. radius as a fraction of the grid height.
   */
  step(encoder, forces) {
    const f = forces || {};
    const dt = Math.min(Math.max(Number.isFinite(f.dt) ? f.dt : 1 / 60, 1 / 240), 0.05);
    const splats = Array.isArray(f.splats) ? f.splats : [];

    // dynamic uniforms (buffers are per-pass, so writeBuffer before submit is safe)
    const ad = this._advectData;
    ad[0] = dt; ad[1] = this.velocityDissipation; ad[2] = 0; ad[3] = 0;
    this.device.queue.writeBuffer(this.u.advect, 0, ad);

    const vo = this._vortData;
    vo[0] = dt; vo[1] = this.vorticity; vo[2] = 0; vo[3] = 0;
    this.device.queue.writeBuffer(this.u.vort, 0, vo);

    const n = Math.min(splats.length, this.maxSplats);
    const sp = this._splatData;
    sp.fill(0);
    sp[0] = dt; sp[1] = n; sp[2] = this.W / this.H; sp[3] = 0;
    for (let i = 0; i < n; i++) {
      const s = splats[i], o = 4 + i * 8;
      sp[o] = s.x; sp[o + 1] = s.y; sp[o + 2] = s.fx; sp[o + 3] = s.fy;
      sp[o + 4] = Math.max(s.radius || 0.05, 1e-4);
    }
    this.device.queue.writeBuffer(this.u.splat, 0, sp);

    const gx = Math.ceil(this.W / 8), gy = Math.ceil(this.H / 8);
    const run = (pipe, bind) => {
      const p = encoder.beginComputePass();
      p.setPipeline(pipe);
      p.setBindGroup(0, bind);
      p.dispatchWorkgroups(gx, gy);
      p.end();
    };

    let s = this._src;
    run(this.pip.advect, this.bg.advect[s]); s ^= 1;          // advect velocity
    run(this.pip.splat, this.bg.splat[s]); s ^= 1;            // add forces
    run(this.pip.curl, this.bg.curl[s]);                      // curl
    run(this.pip.vort, this.bg.vort[s]); s ^= 1;              // vorticity confinement
    run(this.pip.div, this.bg.div[s]);                        // divergence

    let ps = this._psrc;
    for (let i = 0; i < this.pressureIterations; i++) {       // Jacobi
      run(this.pip.jacobi, this.bg.jacobi[ps]);
      ps ^= 1;
    }
    run(this.pip.grad, this.bg.grad[s * 2 + ps]); s ^= 1;     // subtract pressure gradient

    this._src = s;
    this._psrc = ps;
  },

  reset() {
    const d = this.device;
    if (!d) return;
    const enc = d.createCommandEncoder();
    for (const t of [this.tex.vel[0], this.tex.vel[1], this.tex.prs[0], this.tex.prs[1], this.tex.div, this.tex.curl]) {
      const p = enc.beginRenderPass({
        colorAttachments: [{ view: t.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 0 } }],
      });
      p.end();
    }
    d.queue.submit([enc.finish()]);
    this._src = 0;
    this._psrc = 0;
  },
};

// =============================================================================
//  WGSL
// =============================================================================
const SH_HEADER = /* wgsl */ `
const NW: u32 = $Wu;
const NH: u32 = $Hu;
const WG: vec2f = vec2f($W.0, $H.0);
const MAXV: f32 = $MAXV;

fn cell(p: vec2i) -> vec2i {
  return clamp(p, vec2i(0), vec2i(i32(NW) - 1, i32(NH) - 1));
}

// finite-range guard: clamps wild values and maps NaN/Inf to zero
fn sane(v: vec2f) -> vec2f {
  return select(vec2f(0.0), clamp(v, vec2f(-MAXV), vec2f(MAXV)), abs(v) < vec2f(MAXV));
}
`;

const WGSL_ADVECT = /* wgsl */ `
struct U { dt: f32, diss: f32, pad0: f32, pad1: f32 };
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> u: U;
@group(0) @binding(3) var dst: texture_storage_2d<rgba16float, write>;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let uv = (vec2f(gid.xy) + 0.5) / WG;
  let v = textureSampleLevel(src, samp, uv, 0.0).xy;          // cells / second
  let back = uv - v * u.dt / WG;                              // semi-Lagrangian trace
  let c = textureSampleLevel(src, samp, back, 0.0).xy * u.diss;
  textureStore(dst, vec2i(gid.xy), vec4f(sane(c), 0.0, 1.0));
}
`;

const WGSL_SPLAT = /* wgsl */ `
struct U {
  dt: f32, count: f32, aspect: f32, pad: f32,
  s: array<vec4f, 16>,      // [2i] = centre.xy, force.xy   [2i+1] = radius
};
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var<uniform> u: U;
@group(0) @binding(2) var dst: texture_storage_2d<rgba16float, write>;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let p = vec2i(gid.xy);
  let uv = (vec2f(p) + 0.5) / WG;
  var v = textureLoad(src, p, 0).xy;
  let n = i32(u.count);
  for (var i = 0; i < n; i = i + 1) {
    let a = u.s[i * 2];
    let b = u.s[i * 2 + 1];
    let d = (uv - a.xy) * vec2f(u.aspect, 1.0);
    let r = max(b.x, 1e-4);
    v = v + a.zw * (exp(-dot(d, d) / (r * r)) * u.dt);
  }
  textureStore(dst, p, vec4f(sane(v), 0.0, 1.0));
}
`;

const WGSL_CURL = /* wgsl */ `
@group(0) @binding(0) var vel: texture_2d<f32>;
@group(0) @binding(1) var dst: texture_storage_2d<rgba16float, write>;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let p = vec2i(gid.xy);
  let l = textureLoad(vel, cell(p + vec2i(-1, 0)), 0);
  let r = textureLoad(vel, cell(p + vec2i( 1, 0)), 0);
  let b = textureLoad(vel, cell(p + vec2i( 0, -1)), 0);
  let t = textureLoad(vel, cell(p + vec2i( 0,  1)), 0);
  let w = 0.5 * ((r.y - l.y) - (t.x - b.x));
  textureStore(dst, p, vec4f(w, 0.0, 0.0, 1.0));
}
`;

const WGSL_VORT = /* wgsl */ `
struct U { dt: f32, eps: f32, pad0: f32, pad1: f32 };
@group(0) @binding(0) var vel: texture_2d<f32>;
@group(0) @binding(1) var curlT: texture_2d<f32>;
@group(0) @binding(2) var<uniform> u: U;
@group(0) @binding(3) var dst: texture_storage_2d<rgba16float, write>;

fn cabs(p: vec2i) -> f32 { return abs(textureLoad(curlT, cell(p), 0).x); }

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let p = vec2i(gid.xy);
  let w = textureLoad(curlT, p, 0).x;
  let g = vec2f(cabs(p + vec2i(1, 0)) - cabs(p + vec2i(-1, 0)),
                cabs(p + vec2i(0, 1)) - cabs(p + vec2i(0, -1))) * 0.5;
  let n = g / (length(g) + 1e-6);
  let force = u.eps * vec2f(n.y, -n.x) * w;
  let v = textureLoad(vel, p, 0).xy + force * u.dt;
  textureStore(dst, p, vec4f(sane(v), 0.0, 1.0));
}
`;

const WGSL_DIV = /* wgsl */ `
@group(0) @binding(0) var vel: texture_2d<f32>;
@group(0) @binding(1) var dst: texture_storage_2d<rgba16float, write>;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let p = vec2i(gid.xy);
  let l = textureLoad(vel, cell(p + vec2i(-1, 0)), 0);
  let r = textureLoad(vel, cell(p + vec2i( 1, 0)), 0);
  let b = textureLoad(vel, cell(p + vec2i( 0, -1)), 0);
  let t = textureLoad(vel, cell(p + vec2i( 0,  1)), 0);
  let d = 0.5 * ((r.x - l.x) + (t.y - b.y));
  textureStore(dst, p, vec4f(d, 0.0, 0.0, 1.0));
}
`;

const WGSL_JACOBI = /* wgsl */ `
struct U { alpha: f32, pad0: f32, pad1: f32, pad2: f32 };
@group(0) @binding(0) var prs: texture_2d<f32>;
@group(0) @binding(1) var divT: texture_2d<f32>;
@group(0) @binding(2) var<uniform> u: U;
@group(0) @binding(3) var dst: texture_storage_2d<rgba16float, write>;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let p = vec2i(gid.xy);
  let l = textureLoad(prs, cell(p + vec2i(-1, 0)), 0).x;
  let r = textureLoad(prs, cell(p + vec2i( 1, 0)), 0).x;
  let b = textureLoad(prs, cell(p + vec2i( 0, -1)), 0).x;
  let t = textureLoad(prs, cell(p + vec2i( 0,  1)), 0).x;
  let d = textureLoad(divT, p, 0).x;
  textureStore(dst, p, vec4f((l + r + b + t - d) * u.alpha, 0.0, 0.0, 1.0));
}
`;

const WGSL_GRAD = /* wgsl */ `
@group(0) @binding(0) var vel: texture_2d<f32>;
@group(0) @binding(1) var prs: texture_2d<f32>;
@group(0) @binding(2) var dst: texture_storage_2d<rgba16float, write>;

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  if (gid.x >= NW || gid.y >= NH) { return; }
  let p = vec2i(gid.xy);
  let l = textureLoad(prs, cell(p + vec2i(-1, 0)), 0).x;
  let r = textureLoad(prs, cell(p + vec2i( 1, 0)), 0).x;
  let b = textureLoad(prs, cell(p + vec2i( 0, -1)), 0).x;
  let t = textureLoad(prs, cell(p + vec2i( 0,  1)), 0).x;
  let v = textureLoad(vel, p, 0).xy - 0.5 * vec2f(r - l, t - b);
  textureStore(dst, p, vec4f(sane(v), 0.0, 1.0));
}
`;

// =============================================================================
//  Page: adapter, test image, display, beat, loop, readout.  Nothing below
//  this line is needed by the solver.
// =============================================================================
const OFFSCREEN = !!(window.__FLUID_OFFSCREEN || window.__MOSH_OFFSCREEN);
const W = Fluid.W, H = Fluid.H;
const FIXED_DT = 1 / 60;
const VIEW_W = 512, VIEW_H = 288;

const errors = [];
const msHist = [];
let msAvg = NaN;
let paused = false;
let adapterLabel = 'unknown';

const $ = (id) => document.getElementById(id);
const showErr = (e) => { $('err').textContent = String(e && e.stack || e); };

// deterministic hash in the brief's style: frac(sin(b * 12.9898) * 43758.5453)
const frac = (v) => v - Math.floor(v);
const hash = (b, seed) => frac(Math.sin(b * 12.9898 + seed) * 43758.5453);
const TAU = Math.PI * 2;

// ---- test image: abstract, no glyphs ---------------------------------------
function drawTestPattern(g, w, h) {
  const bg = g.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#0b1526');
  bg.addColorStop(1, '#12283a');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);

  // three hard-edged discs
  const discs = [
    [w * 0.20, h * 0.30, h * 0.30, 'rgba(64,196,255,0.90)'],
    [w * 0.55, h * 0.74, h * 0.34, 'rgba(255,138,52,0.85)'],
    [w * 0.83, h * 0.22, h * 0.20, 'rgba(120,255,196,0.80)'],
  ];
  for (const [cx, cy, r, col] of discs) {
    g.fillStyle = col;
    g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  }

  // diagonal stripes across the whole frame
  g.save();
  g.translate(-w * 0.4, 0);
  g.rotate(0.62);
  for (let i = 0; i < 44; i++) {
    g.fillStyle = i % 3 === 0 ? 'rgba(255,255,255,0.20)' : 'rgba(6,20,36,0.22)';
    g.fillRect(i * 18, -h * 2, i % 3 === 0 ? 5 : 12, h * 6);
  }
  g.restore();

  // concentric rings
  g.lineWidth = 2.5;
  for (let i = 0; i < 8; i++) {
    g.strokeStyle = `hsla(${186 + i * 20}, 95%, 72%, ${0.85 - i * 0.07})`;
    g.beginPath();
    g.arc(w * 0.32, h * 0.58, h * 0.05 + i * h * 0.048, 0.2 + i * 0.11, 0.2 + i * 0.11 + Math.PI * 1.4);
    g.stroke();
  }

  // dot lattice
  g.fillStyle = 'rgba(240,250,255,0.9)';
  for (let y = 9; y < h; y += 14) {
    for (let x = 9; x < w; x += 14) {
      const dx = (x - w * 0.32) / (w * 0.55), dy = (y - h * 0.58) / (h * 0.6);
      const k = 1 - Math.min(1, Math.hypot(dx, dy));
      if (k > 0.03) { g.beginPath(); g.arc(x, y, 1.7 * k + 0.5, 0, TAU); g.fill(); }
    }
  }
}
// ---- boot -----------------------------------------------------------------
const ready = (async () => {
  if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('no WebGPU adapter');
  try {
    const info = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
    if (info) adapterLabel = [info.vendor, info.architecture, info.description].filter(Boolean).join(' / ') || info.device || 'unknown';
  } catch { /* adapter info is optional */ }

  const device = await adapter.requestDevice();
  device.addEventListener('uncapturederror', (e) => {
    errors.push(String(e.error && e.error.message || e.error));
    showErr(errors.slice(-3).join('\n'));
  });
  device.lost.then((info) => {
    errors.push('DEVICE LOST: ' + info.reason + ' ' + info.message);
    showErr(errors.slice(-3).join('\n'));
  });
  await Fluid.init(device);

  // --- display target
  const displayFormat = OFFSCREEN ? 'rgba8unorm' : navigator.gpu.getPreferredCanvasFormat();
  let targetView;
  let offTex = null;
  if (OFFSCREEN) {
    const off = device.createTexture({
      size: { width: VIEW_W, height: VIEW_H }, format: displayFormat,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });
    offTex = off;
    targetView = () => off.createView();
  } else {
    const ctx = $('view').getContext('webgpu');
    ctx.configure({ device, format: displayFormat, alphaMode: 'opaque' });
    targetView = () => ctx.getCurrentTexture().createView();
  }

  // --- test image (sampled by the display when the toggle is on)
  const imgTex = device.createTexture({
    size: { width: W, height: H }, format: 'rgba8unorm',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  const imgView = imgTex.createView();

  const patCanvas = document.createElement('canvas');
  patCanvas.width = W; patCanvas.height = H;
  drawTestPattern(patCanvas.getContext('2d'), W, H);
  device.queue.copyExternalImageToTexture({ source: patCanvas }, { texture: imgTex }, { width: W, height: H });

  const sampler = device.createSampler({
    magFilter: 'linear', minFilter: 'linear',
    addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
  });

  // --- display pipeline
  const dispShader = device.createShaderModule({ code: DISPLAY_WGSL });
  const dispPipe = await device.createRenderPipelineAsync({
    layout: 'auto',
    vertex: { module: dispShader, entryPoint: 'vs' },
    fragment: { module: dispShader, entryPoint: 'fs', targets: [{ format: displayFormat }] },
    primitive: { topology: 'triangle-list' },
  });
  const dispU = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const dispBG = new Map();
  const displayBind = (velView, imgView) => {
    let m = dispBG.get(velView);
    if (!m) { m = new Map(); dispBG.set(velView, m); }
    let bg = m.get(imgView);
    if (!bg) {
      bg = device.createBindGroup({
        layout: dispPipe.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: velView },
          { binding: 1, resource: sampler },
          { binding: 2, resource: imgView },
          { binding: 3, resource: { buffer: dispU } },
        ],
      });
      m.set(imgView, bg);
    }
    return bg;
  };

  // --- image advection is done in the display shader (single backtrace step)

  // ---- beat: an impulse every 0.5 s of simulated time
  const beat = { t: 0, next: 0.06, n: 0 };
  const drag = { active: false, x: 0, y: 0, fx: 0, fy: 0, ttl: 0 };
  let lastT = performance.now();
  let dtNow = FIXED_DT;

  function forcesFor(dt) {
    const splats = [];
    beat.t += dt;
    while (beat.t >= beat.next) {
      const b = beat.n++;
      beat.next += 0.5;
      const ang = hash(b, 3.141) * TAU;
      // fixed velocity delta per impulse, independent of frame time
      const mag = (7000 + 5000 * hash(b, 7.77)) * FIXED_DT / dt;
      splats.push({
        x: 0.12 + 0.76 * hash(b, 0),
        y: 0.16 + 0.68 * hash(b, 1.618),
        fx: Math.cos(ang) * mag,
        fy: Math.sin(ang) * mag,
        radius: 0.05 + 0.04 * hash(b, 11.3),
      });
    }
    if (drag.ttl > 0) {
      splats.push({ x: drag.x, y: drag.y, fx: drag.fx, fy: drag.fy, radius: 0.055 });
      drag.ttl -= dt;
    }
    return { dt, splats };
  }

  // ---- input: mouse drag adds force
  const view = $('view');
  const uvOf = (ev) => {
    const r = view.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width, y: 1 - (ev.clientY - r.top) / r.height };
  };
  let last = null;
  view.addEventListener('pointerdown', (ev) => {
    last = uvOf(ev);
    drag.active = true;
    view.setPointerCapture(ev.pointerId);
  });
  view.addEventListener('pointermove', (ev) => {
    if (!drag.active) return;
    const p = uvOf(ev);
    const dx = p.x - last.x, dy = p.y - last.y;
    last = p;
    const gain = 3700 * FIXED_DT / dtNow; // uv delta -> cells/second (fixed velocity delta)
    drag.x = p.x; drag.y = p.y;
    drag.fx = dx * gain; drag.fy = dy * gain;
    drag.ttl = 0.07;
  });
  const endDrag = () => { drag.active = false; last = null; };
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  view.addEventListener('pointerleave', () => { if (!drag.active) drag.ttl = 0; });

  // ---- readout
  function pushSample(ms) {
    msHist.push(ms);
    if (msHist.length > 30) msHist.shift();
    msAvg = msHist.reduce((a, b) => a + b, 0) / msHist.length;
    $('ms').textContent = msAvg.toFixed(2);
    if (msHist.length === 30 && !pushSample.logged) {
      pushSample.logged = true;
      console.log(`[fluid] ms/step avg30 = ${msAvg.toFixed(2)} (adapter: ${adapterLabel}; grid ${W}x${H}; target ${OFFSCREEN ? 'offscreen' : 'canvas'})`);
    }
  }

  // ---- one frame
  async function stepOnce() {
    const t0 = performance.now();
    const dt = Math.min(Math.max((t0 - lastT) / 1000, 1 / 240), 1 / 30);
    lastT = t0;
    dtNow = dt;
    const forces = forcesFor(dt);
    const enc = device.createCommandEncoder();
    Fluid.step(enc, forces);

    device.queue.writeBuffer(dispU, 0, new Float32Array([$('imgmode').checked ? 1 : 0, 0.018, dt, 4]));
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view: targetView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    pass.setPipeline(dispPipe);
    pass.setBindGroup(0, displayBind(Fluid.velocityView, imgView));
    pass.draw(3);
    pass.end();

    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
    pushSample(performance.now() - t0);
  }


  async function frame() {
    if (!paused) {
      try { await stepOnce(); } catch (e) { showErr(e); console.error(e); }
    }
    requestAnimationFrame(frame);
  }

  // ---- test hooks (the page loop is otherwise independent)
  async function grabDisplay() {
    if (!offTex) return null;
    const bpr = Math.ceil(VIEW_W * 4 / 256) * 256;
    const buf = device.createBuffer({ size: bpr * VIEW_H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const e = device.createCommandEncoder();
    e.copyTextureToBuffer({ texture: offTex }, { buffer: buf, bytesPerRow: bpr }, { width: VIEW_W, height: VIEW_H });
    device.queue.submit([e.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const a = new Uint8Array(buf.getMappedRange().slice(0));
    buf.unmap(); buf.destroy();
    let sum = 0, lit = 0, max = 0;
    for (let y = 0; y < VIEW_H; y++) {
      for (let x = 0; x < VIEW_W; x++) {
        const i = y * bpr + x * 4;
        const l = (a[i] + a[i + 1] + a[i + 2]) / 3;
        sum += l;
        if (l > 8) lit++;
        if (l > max) max = l;
      }
    }
    const n = VIEW_W * VIEW_H;
    return { w: VIEW_W, h: VIEW_H, mean: sum / n, lit: lit / n, max };
  }

  window.__lab = window.__lab || {};
  Object.assign(window.__lab, {
    fluid: Fluid,
    device,
    errors,
    W, H,
    pause: () => { paused = true; },
    resume: () => { paused = false; },
    run: async (n) => {
      const t0 = performance.now();
      for (let i = 0; i < n; i++) await stepOnce();
      return (performance.now() - t0) / n;
    },
    ms: () => msAvg,
    adapter: () => adapterLabel,
    grab: () => grabDisplay(),
    reset: () => Fluid.reset(),
    state: () => ({ msAvg, samples: msHist.length, beats: beat.n, time: beat.t, paused, mode: $('imgmode').checked }),
  });
  window.Fluid = Fluid;

  requestAnimationFrame(frame);
  return { ok: true, adapter: adapterLabel, grid: [W, H], offscreen: OFFSCREEN };
})().catch((e) => {
  showErr(e);
  console.error(e);
  return { ok: false, error: String(e && e.message || e) };
});

const lab = window.__lab = window.__lab || {};
lab.ready = ready;

// =============================================================================
//  Display WGSL (page-side only: velocity colour + test-image advection)
// =============================================================================
const DISPLAY_WGSL = /* wgsl */ `
struct U { mode: f32, exposure: f32, dt: f32, warp: f32 };
@group(0) @binding(0) var velTex: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var imgTex: texture_2d<f32>;
@group(0) @binding(3) var<uniform> u: U;

struct VSOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VSOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VSOut;
  o.pos = vec4f(p[i], 0.0, 1.0);
  o.uv = vec2f(p[i].x * 0.5 + 0.5, 0.5 - p[i].y * 0.5);
  return o;
}

@fragment
fn fs(in: VSOut) -> @location(0) vec4f {
  let sim = vec2f(in.uv.x, 1.0 - in.uv.y);
  let v = textureSampleLevel(velTex, samp, sim, 0.0).xy;      // cells / second, y up

  if (u.mode < 0.5) {
    // velocity field as colour: hue = direction, brightness = speed
    let speed = length(v);
    let a = atan2(v.y, v.x);
    let hue = vec3f(0.5) + 0.5 * vec3f(cos(a), cos(a - 2.0944), cos(a + 2.0944));
    var k = 1.0 - exp(-speed * u.exposure);
    k = pow(k, 0.72);
    return vec4f(hue * k + vec3f(0.012, 0.016, 0.030), 1.0);
  }

  // advect the test image: one semi-Lagrangian backtrace along the velocity field
  let disp = vec2f(v.x, -v.y) * (u.warp * u.dt) / vec2f(${W}.0, ${H}.0);
  let back = clamp(in.uv - disp, vec2f(0.0), vec2f(1.0));
  return vec4f(textureSampleLevel(imgTex, samp, back, 0.0).rgb, 1.0);
}
`;


</script>
