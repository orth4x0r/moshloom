<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moshloom</title>
<style>
:root{--bg:#0a0b0a;--p1:#121412;--p2:#1a1d1a;--ln:#2a2f2a;--tx:#d7e0d5;--dim:#7d8a7b;--ac:#3dff7a;--hot:#ff3da5;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.4 var(--mono)}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--ln);padding:5px 9px;border-radius:3px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.on,button.pri{background:var(--ac);color:#04140a;border-color:var(--ac);font-weight:700}
button.rec{border-color:var(--hot);color:var(--hot)}
button.rec.on{background:var(--hot);color:#fff}
button:disabled{opacity:.4;cursor:default}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--ln);padding:4px 6px;border-radius:3px;color:var(--tx)}
input[type=number]{width:74px}
input[type=range]{width:100%;accent-color:var(--ac)}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);background:var(--p1)}
header h1{font-size:13px;letter-spacing:.32em;margin:0 6px 0 0;color:var(--ac);font-weight:700}
.grp{display:flex;gap:5px;align-items:center}
.grp label{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
main{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:0}
#stage{display:flex;flex-direction:column;min-height:0;min-width:0;background:#000}
#cvwrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#000}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(61,255,122,.12);border:2px dashed var(--ac);font-size:14px;letter-spacing:.2em}
#transport{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--p1);border-top:1px solid var(--ln)}
#pos{font-variant-numeric:tabular-nums;color:var(--ac);min-width:190px}
#status{color:var(--dim);margin-left:auto;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#insp{border-left:1px solid var(--ln);background:var(--p1);padding:10px 12px;overflow:auto}
#insp h2{font-size:10px;letter-spacing:.2em;color:var(--dim);margin:14px 0 6px;font-weight:400;text-transform:uppercase;border-bottom:1px solid var(--ln);padding-bottom:4px}
#insp h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:78px minmax(0,1fr) 34px;gap:6px;align-items:center;margin:5px 0}
.row>span:first-child{color:var(--dim)}
.row select,.row input[type=number]{width:100%;grid-column:2/4}
.row output{text-align:right;color:var(--ac);font-variant-numeric:tabular-nums}
.mod{display:grid;grid-template-columns:1fr 1fr 64px;gap:4px;margin:4px 0}
.mod select{min-width:0}.mod input{width:100%}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.note{color:var(--dim);font-size:10px}
#bottom{border-top:1px solid var(--ln);background:var(--p1);min-width:0}
.lib{display:flex;gap:5px;align-items:center;padding:6px 12px 0;flex-wrap:wrap}
.lib:last-of-type{padding-bottom:6px}
.lib .cap{color:var(--dim);letter-spacing:.2em;font-size:10px;width:52px}
.chip{border:1px solid var(--ln);border-left-width:8px;padding:3px 8px;border-radius:3px;cursor:pointer;background:var(--p2);user-select:none}
.chip:hover{background:#232823}
#tl{overflow-x:auto;overflow-y:hidden;position:relative;border-top:1px solid var(--ln);background:var(--bg)}
#tlin{position:relative;height:172px;min-width:100%}
#ruler{position:absolute;left:0;right:0;top:0;height:20px;border-bottom:1px solid var(--ln);cursor:pointer}
#ruler span{position:absolute;top:3px;font-size:10px;color:var(--dim);padding-left:3px;border-left:1px solid var(--ln);height:17px;pointer-events:none}
#energy{position:absolute;left:0;top:20px;height:44px;width:100%;cursor:pointer}
#track{position:absolute;left:0;right:0;top:68px;height:62px}
#fxl{position:absolute;left:0;right:0;top:134px;height:24px;background:repeating-linear-gradient(90deg,#101210 0 1px,transparent 1px 100%)}
.blk{position:absolute;top:0;height:62px;border-radius:3px;overflow:hidden;cursor:grab;user-select:none;border:1px solid rgba(0,0,0,.6);border-top:5px solid;color:#fff;touch-action:none;background:#161916 center/cover}
.blk.sel{outline:2px solid #fff;outline-offset:-2px;z-index:2}
.blk .nm{position:absolute;left:4px;top:16px;font-weight:700;font-size:11px;white-space:nowrap;pointer-events:none;background:rgba(0,0,0,.62);padding:0 3px}
.blk .ln{position:absolute;left:4px;top:33px;font-size:10px;white-space:nowrap;pointer-events:none;background:rgba(0,0,0,.62);padding:0 3px;color:#cfd6cd}
.blk .tr{position:absolute;left:0;top:0;font-size:9px;background:#07090a;color:#fff;padding:1px 4px;border-bottom-right-radius:3px;letter-spacing:.06em;pointer-events:none}
.blk .mo{position:absolute;left:0;bottom:0;height:3px;background:#fff;opacity:.7;pointer-events:none}
.rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(0,0,0,.35)}
.fx{position:absolute;top:2px;height:20px;border-radius:3px;background:#2b2440;border:1px solid #9b7bff;color:#e6dcff;font-size:10px;padding:2px 5px;overflow:hidden;white-space:nowrap;cursor:grab;user-select:none;touch-action:none}
.fx.sel{outline:2px solid #fff;outline-offset:-1px;z-index:2}
.tz{position:absolute;top:0;height:62px;pointer-events:none;z-index:3;background:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 3px,transparent 3px 7px);mix-blend-mode:overlay;border-left:1px solid #fff;border-right:1px solid #fff}
#ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:5;pointer-events:none;box-shadow:0 0 6px #fff}
#endm{position:absolute;top:20px;bottom:0;width:0;border-left:1px dashed var(--hot);z-index:4;pointer-events:none}
#ins{position:absolute;top:66px;height:66px;width:3px;background:var(--ac);z-index:6;display:none;pointer-events:none}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20}
.dlg>div{background:var(--p1);border:1px solid var(--ln);padding:14px;width:min(760px,94vw);border-radius:4px;max-height:92vh;overflow:auto}
.dlg textarea{width:100%;height:260px;font:11px/1.45 var(--mono);white-space:pre;tab-size:2}
.dlg h3{margin:0 0 8px;font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:400;text-transform:uppercase}
#serr{color:var(--hot);min-height:16px;margin-top:6px;white-space:pre-wrap}
#err{position:fixed;left:12px;bottom:12px;right:12px;background:#3a0b16;border:1px solid var(--hot);padding:10px;display:none;z-index:30;border-radius:4px}
#toast{position:fixed;right:12px;bottom:12px;z-index:31;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
#toast .t{max-width:520px;background:#160b1c;border:1px solid var(--hot);color:#ffd7e3;padding:8px 10px;border-radius:4px;font-size:11px;line-height:1.45;box-shadow:0 4px 18px #0008}
#toast .t.warn{border-color:var(--ac);color:var(--ac)}
#stats{position:fixed;left:12px;bottom:56px;z-index:29;display:none;white-space:pre;font:11px/1.45 ui-monospace,Consolas,monospace;color:#d9ffe9;background:#0b120dcc;border:1px solid #2b6b45;border-radius:4px;padding:8px 10px;pointer-events:none}
@media (max-width:820px){body{height:auto;overflow:auto;display:block}main{grid-template-columns:1fr}#insp{border-left:0;border-top:1px solid var(--ln)}#cvwrap{aspect-ratio:16/9}}
</style>
</head>
<body>
<header>
  <h1>MOSHLOOM</h1>
  <div class="grp"><button id="bLoad" class="pri">Load track</button><input id="file" type="file" accept="audio/*" hidden><input id="mfile" type="file" accept="image/*,video/*" hidden><span id="tname" style="color:var(--dim)">demo beat · no audio</span></div>
  <div class="grp"><label>BPM</label><input id="bpm" type="number" step="0.01" min="30" max="300"><button id="bHalf" title="Half tempo">÷2</button><button id="bDbl" title="Double tempo">×2</button><button id="bTap" title="Tap the beat 4+ times while it plays (or press T)">Tap</button></div>
  <div class="grp"><label>Grid</label><button id="oM" title="Grid 10 ms earlier">−10ms</button><button id="oP" title="Grid 10 ms later">+10ms</button><button id="oB" title="Move bar 1 one beat later">beat ›</button></div>
  <div class="grp"><label>Size</label><select id="res"></select></div>
  <div class="grp"><label>Engine</label><select id="engine" title="Restart the renderer in another mode"><option value="main">main · GPU</option><option value="worker">worker · GPU</option><option value="cpu">CPU</option></select><span id="mode">…</span></div>
  <div class="grp"><button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Shift+Z)">↷</button><button id="bAuto" title="Build a new arrangement from the track's sections">Auto-arrange</button><button id="bShd">Shaders</button><button id="bProj">Project</button><button id="bExp" class="rec">⬇ Export video</button></div>
</header>
<main>
  <div id="stage">
    <div id="cvwrap"><canvas id="cv" width="640" height="360"></canvas><div id="drop">DROP AUDIO FILE</div></div>
    <div id="transport"><button id="bPlay" class="pri">▶ Play</button><button id="bStop">⏮</button><span id="pos">–</span><span id="status"></span></div>
  </div>
  <div id="insp"></div>
</main>
<div id="bottom">
  <div class="lib" id="lib"></div>
  <div class="lib" id="fxlib"></div>
  <div id="tl"><div id="tlin"><div id="ruler"></div><canvas id="energy" width="4000" height="44"></canvas><div id="track"></div><div id="fxl"></div><div id="endm"></div><div id="ins"></div><div id="ph"></div></div></div>
</div>
<div class="dlg" id="dlg"><div>
  <h3>Projects</h3>
  <div class="btns" style="margin:0 0 10px"><input id="pjName" type="text" placeholder="name" style="width:180px"><button id="pjSave" class="pri">Save in this browser</button><select id="pjList"></select><button id="pjLoad">Load</button><button id="pjDel">Delete</button></div>
  <div class="note" style="margin-bottom:6px">Project JSON — copy it to keep an arrangement elsewhere, or paste one and press Apply. Media files are not included; re-add them after loading.</div>
  <textarea id="pj" spellcheck="false"></textarea>
  <div class="btns"><button id="pjCopy">Copy</button><button id="pjApply" class="pri">Apply</button><button id="pjClose">Close</button></div></div></div>
<div class="dlg" id="sdlg"><div>
  <h3>Custom shader visuals (WGSL)</h3>
  <div class="btns" style="margin:0 0 8px"><select id="sList"></select><button id="sNew">New</button><input id="sName" type="text" placeholder="name" style="width:160px"><button id="sDel">Delete</button></div>
  <textarea id="sCode" spellcheck="false" style="height:330px"></textarea>
  <div id="serr"></div>
  <div class="btns"><button id="sSave" class="pri">Compile &amp; save</button><button id="sClose">Close</button><span class="note" style="align-self:center">A saved shader appears as a block in the Blocks row.</span></div></div></div>
<div id="err"></div><div id="toast"></div><div id="stats"></div>

<script id="proto">
/* One definition of the worker protocol, used verbatim by the page and by the worker. */
(function (scope) {
  const P = {
    version: 1,
    types: ['init', 'ready', 'analyze', 'synth', 'analysis-done', 'analysis-progress', 'error',
      'features', 'features-ok', 'project', 'project-ok', 'seek', 'seek-ok', 'resize', 'resize-ok',
      'frame', 'frame-done', 'readback', 'readback-done', 'plan', 'plan-done',
      'media-image', 'media-image-ok', 'media-frame', 'media-frame-ok',
      'media-request', 'media-frames', 'thumb', 'thumb-done',
      'export', 'export-progress', 'export-done', 'export-cancel'],
    make(type, payload, id) { return { v: P.version, t: type, id: id === undefined ? null : id, p: payload || {} }; },
    check(m) { return !!m && typeof m === 'object' && m.v === P.version && P.types.indexOf(m.t) >= 0; },
    // fields the sender may transfer (a transfer detaches the buffer on the sending side)
    transfer: { analyze: ['pcm'], 'analysis-done': ['arrays', 'mel'] },
  };
  scope.PROTO = P;
})(self);
</script>
<script type="text/plain" id="analysis-worker">
/* analysis worker: its own wasm instance, no DOM, no rendering. */
let X = null, WSV = null;
function collect(id) {
  const nf = X.get_nf();
  const ids = [0, 1, 2, 3, 4, 5, 6];                  // rms bass mid high kick snare hat
  const arrays = ids.map((i) => new Float32Array(X.memory.buffer, X.feat(i), nf).slice());
  const mel = new Float32Array(X.memory.buffer, X.mel_ptr(), nf * 24).slice();
  const msg = PROTO.make('analysis-done', { nf, bpm: X.get_bpm(), offs: X.get_offs(), arrays, mel }, id);
  self.postMessage(msg, arrays.map((a) => a.buffer).concat([msg.p.mel.buffer]));
}
self.onmessage = (ev) => {
  const m = ev.data;
  try {
    if (!PROTO.check(m)) throw new Error('bad message');
    if (m.t === 'init') {
      return WebAssembly.instantiate(m.p.wasm, {}).then(({ instance }) => {
        X = instance.exports; X.init(640, 360);
        self.postMessage(PROTO.make('ready', {}, m.id));
      }).catch((err) => self.postMessage(PROTO.make('error', { message: 'wasm: ' + err.message }, m.id)));
    }
    if (!X) throw new Error('worker not initialised');
    if (m.t === 'synth') { X.synth(m.p.frames, m.p.bpm); collect(m.id); return; }
    if (m.t === 'analyze') {
      const pcm = new Float32Array(m.p.pcm);
      const p = X.alloc(pcm.length * 4);
      if (!p) throw new Error('not enough memory for this track');
      new Float32Array(X.memory.buffer, p, pcm.length).set(pcm);
      X.analyze(p, pcm.length, m.p.sr || 22050);
      collect(m.id);
    }
  } catch (err) { self.postMessage(PROTO.make('error', { message: String((err && err.message) || err) }, m.id)); }
};
</script>
<script type="text/plain" id="render-worker">
/* render worker: its own wasm instance, its own GPU device, a transferred OffscreenCanvas. */
let WSV = null, mediaReq = 0, mediaWait = new Map(), exportCancel = false;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function wReply(type, payload, id, transfer) { self.postMessage(PROTO.make(type, payload, id), transfer || []); }
function mediaTex(i, w, h, kind) {
  let m = G.media[i];
  if (!m) { m = {}; G.media[i] = m; }
  if (m.tex && (m.w !== w || m.h !== h)) { m.tex.destroy(); m.tex = null; }
  if (!m.tex) { const T = GPUTextureUsage; m.tex = G.tex(w, h, 'rgba8unorm', T.TEXTURE_BINDING | T.COPY_DST | T.RENDER_ATTACHMENT); }
  m.w = w; m.h = h; if (kind) m.kind = kind;
  return m;
}
function recvMedia(p, kind) {
  const m = mediaTex(p.index, p.w, p.h, kind || p.kind);
  if (p.dur) m.dur = p.dur;
  if (p.name) m.name = p.name;
  G.dev.queue.copyExternalImageToTexture({ source: p.bitmap }, { texture: m.tex }, [p.w, p.h]);
  try { p.bitmap.close(); } catch (e) {}
}
function activeVideoClips(f, bpm, offs, fps) {
  const X = gpuWasm(), S = X.block_floats(), rec = new Float32Array(X.memory.buffer, X.blocks_ptr(), 512 * S);
  const bp = (f / fps - offs) * bpm / 60; let st = 0; const out = [], seen = new Set();
  for (let i = 0; i < 512; i++) {
    const o = i * S, len = rec[o + 1]; if (!len) break;
    if (rec[o + 2] === 16 && bp >= st - rec[o + 5] && bp < st + len) {
      const clip = rec[o + 11] | 0, m = G.media[clip];
      if (m && m.kind === 'video' && !seen.has(clip)) {
        const dur = m.dur || 1; let t = (((bp - st) * 60 / bpm) % dur + dur) % dur;
        t = Math.round(t * fps) / fps;
        out.push({ clip, time: t }); seen.add(clip);
      }
    }
    st += len;
  }
  return out;
}
function requestMedia(f, clips) {
  const req = ++mediaReq;
  self.postMessage(PROTO.make('media-request', { req, f, clips }));
  return new Promise((res, rej) => {
    mediaWait.set(req, { res, rej });
    setTimeout(() => { if (mediaWait.delete(req)) rej(new Error('media request timed out')); }, 15000);
  });
}
async function runWorkerExport(p, id) {
  exportCancel = false;
  let prevOff = null, prevW = 0, prevH = 0;

    if (!G || !G.ok) throw new Error('export needs the GPU render worker');
    if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined' || typeof Mp4Muxer === 'undefined')

    const br = w >= 1920 ? 16e6 : w >= 1280 ? 10e6 : w >= 960 ? 7e6 : 4.5e6;
    let vc = null, mp4 = false;
    for (const [c, m] of [['avc1.640028', 1], ['avc1.4d0028', 1], ['avc1.420028', 1], ['vp09.00.40.08', 0], ['vp8', 0]]) {
      try { if ((await VideoEncoder.isConfigSupported({ codec: c, width: w, height: h, bitrate: br, framerate: fps })).supported) { vc = c; mp4 = !!m; break; } } catch (e) {}
    }

    let ac = null, ch = 0, sr = 0, chs = null;
    if (p.audio && p.audio.channels && p.audio.channels.length && typeof AudioEncoder !== 'undefined') {
      ch = p.audio.channels.length; sr = p.audio.sampleRate; chs = p.audio.channels;
      for (const c of (mp4 ? ['mp4a.40.2'] : ['opus'])) {
        try { if ((await AudioEncoder.isConfigSupported({ codec: c, sampleRate: sr, numberOfChannels: ch, bitrate: 192000 })).supported) { ac = c; break; } } catch (e) {}
      }
      if (!ac && mp4) {
        for (const c of ['vp09.00.40.08', 'vp8']) {
          try { if ((await VideoEncoder.isConfigSupported({ codec: c, width: w, height: h, bitrate: br, framerate: fps })).supported) { vc = c; mp4 = false; break; } } catch (e) {}
        }
        if (!mp4) { try { if ((await AudioEncoder.isConfigSupported({ codec: 'opus', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 })).supported) ac = 'opus'; } catch (e) {} }
      }
    }
    const M = mp4 ? Mp4Muxer : WebMMuxer, target = new M.ArrayBufferTarget();
    const mux = new M.Muxer({ target, video: { codec: mp4 ? 'avc' : (vc === 'vp8' ? 'V_VP8' : 'V_VP9'), width: w, height: h, frameRate: fps },
      ...(ac ? { audio: { codec: mp4 ? 'aac' : 'A_OPUS', numberOfChannels: ch, sampleRate: sr } } : {}), ...(mp4 ? { fastStart: 'in-memory' } : {}), firstTimestampBehavior: 'offset' });
    let encErr = null, vChunks = 0, vBytes = 0;

    venc.configure({ codec: vc, width: w, height: h, bitrate: br, framerate: fps });

    const dev = G.dev, row = Math.ceil(w * 4 / 256) * 256;
    const buf = dev.createBuffer({ size: row * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const bgra = G.fmt.indexOf('bgra') === 0;
    let blackRun = 0, probes = 0, litProbes = 0;

      if (exportCancel) throw new Error('cancelled');
      if (encErr) throw encErr;
      const clips = activeVideoClips(f, p.bpm, p.offs, fps);
      if (clips.length) {
        const frames = await requestMedia(f, clips);
        for (const fr of frames) {
          const bmp = fr.bitmap; if (!bmp) continue;
          const m = mediaTex(fr.clip, bmp.width, bmp.height, 'video');
          dev.queue.copyExternalImageToTexture({ source: bmp }, { texture: m.tex }, [bmp.width, bmp.height]);
          try { bmp.close(); } catch (e) {}
        }

      gpuFrame(f);
      await dev.queue.onSubmittedWorkDone();
      const ce = dev.createCommandEncoder();
      ce.copyTextureToBuffer({ texture: G.off }, { buffer: buf, bytesPerRow: row }, [w, h]);
      dev.queue.submit([ce.finish()]);
      await buf.mapAsync(GPUMapMode.READ);
      const mapped = new Uint8Array(buf.getMappedRange());

      el.addEventListener('seeked',fin,{once:true});el.currentTime=q;setTimeout(fin,1000);});

async function addWorkerMedia(file){
  const i=G.media.length;

    const el=document.createElement('video'); el.muted=true; el.loop=true; el.playsInline=true; el.src=URL.createObjectURL(file);

    await seekVideoExact(el,0);
    const bmp=await createImageBitmap(el,{resizeWidth:w,resizeHeight:h,resizeQuality:'high'});
    await rwCall('media-frame',{index:i,bitmap:bmp,w,h,dur:m.dur,kind:'video'},[bmp]);

  }

    let audio=null, transfer=[];
    if(abuf&&typeof AudioEncoder!=='undefined'){
      const ch=Math.min(2,abuf.numberOfChannels), sr=abuf.sampleRate, total=Math.min(abuf.length,Math.floor(dur*sr));
      const channels=[...Array(ch).keys()].map(c=>abuf.getChannelData(c).slice(0,total));
      audio={sampleRate:sr,channels}; transfer=channels.map(a=>a.buffer);
    }
    const r=await rwCall('export',{w:W,h:H,nf,fps:FPS,bpm,offs,audio},transfer);
    lastBlob={blob:new Blob([r.buf],{type:r.type}),ext:r.ext};
    if(!lastBlob.blob.size)throw new Error('export produced an empty file (0-byte blob)');
    btn.textContent='⬇ Save video'; status(`export done · ${sizeLabel(lastBlob.blob.size)} ${lastBlob.ext}${abuf&&!r.audio?' (no audio encoder here — video only)':''} — press Save video`);
  }catch(e){ btn.textContent='⬇ Export video'; status(e.message==='cancelled'?'export cancelled':'Export failed: '+(e.message||e)); }
  exporting=null; btn.classList.remove('on'); pos=0; refresh();
}
async function exportVideo(){
  if(renderIn==='worker') return exportInWorker();
  if(!window.VideoEncoder||!window.VideoFrame||typeof Mp4Muxer==='undefined'){startRec();return;}
  pause(); const job={cancel:false}; exporting=job; const btn=$('bExp'); btn.classList.add('on');
  let prevOff=null, capBuf=null, capRow=0, capFmt='RGBA';
  try{
    const br=W>=1920?16e6:W>=1280?10e6:W>=960?7e6:4.5e6; let vc=null,mp4=false,vBytes=0,vChunks=0;
    for(const [c,m] of [['avc1.640028',1],['avc1.4d0028',1],['avc1.420028',1],['vp09.00.40.08',0],['vp8',0]]){
      try{ if((await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:br,framerate:FPS})).supported){vc=c;mp4=!!m;break;} }catch(e){} }
    if(!vc)throw new Error('no video encoder available in this browser');
    let ac=null; const ch=abuf?Math.min(2,abuf.numberOfChannels):0, sr=abuf?abuf.sampleRate:0;
    if(abuf&&window.AudioEncoder){
      for(const c of (mp4?['mp4a.40.2']:['opus'])){ try{ if((await AudioEncoder.isConfigSupported({codec:c,sampleRate:sr,numberOfChannels:ch,bitrate:192000})).supported){ac=c;break;} }catch(e){} }
      if(!ac&&mp4){   // no AAC here: an MP4 with Opus will not play in QuickTime or on iOS, so switch to WebM
        for(const c of ['vp09.00.40.08','vp8']){
          try{ if((await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:br,framerate:FPS})).supported){vc=c;mp4=false;break;} }catch(e){}
        }
        if(!mp4){ try{ if((await AudioEncoder.isConfigSupported({codec:'opus',sampleRate:sr,numberOfChannels:ch,bitrate:192000})).supported)ac='opus'; }catch(e){} }
      }
    }
    const M=mp4?Mp4Muxer:WebMMuxer, target=new M.ArrayBufferTarget();
    const mux=new M.Muxer({target,video:{codec:mp4?'avc':(vc==='vp8'?'V_VP8':'V_VP9'),width:W,height:H,frameRate:FPS},
      ...(ac?{audio:{codec:mp4?'aac':'A_OPUS',numberOfChannels:ch,sampleRate:sr}}:{}),...(mp4?{fastStart:'in-memory'}:{}),firstTimestampBehavior:'offset'});
    let encErr=null;
    const venc=new VideoEncoder({output:(c,m)=>{vChunks++;vBytes+=c.byteLength;mux.addVideoChunk(c,m);},error:e=>{encErr=e;}}); venc.configure({codec:vc,width:W,height:H,bitrate:br,framerate:FPS});
    if(ac){ const aenc=new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>{encErr=e;}}); aenc.configure({codec:ac,sampleRate:sr,numberOfChannels:ch,bitrate:192000});
      const total=Math.min(abuf.length,Math.floor(dur*sr)),N=8192,chs=[...Array(ch).keys()].map(c=>abuf.getChannelData(c));
      for(let o=0;o<total;o+=N){const n=Math.min(N,total-o),d=new Float32Array(n*ch);for(let c=0;c<ch;c++)d.set(chs[c].subarray(o,o+n),c*n);
        const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(o/sr*1e6),data:d});aenc.encode(ad);ad.close();
        if(aenc.encodeQueueSize>40)await sleep(1);} await aenc.flush(); aenc.close(); }
    if(mode==='gpu'){
      prevOff=ENV.offscreen;
      gpuAttach({offscreen:true}); gpuResize(W,H);     // export from a texture, never from a presented canvas
      capRow=Math.ceil(W*4/256)*256;
      capBuf=G.dev.createBuffer({size:capRow*H,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
      capFmt=G.fmt.indexOf('bgra')===0?'BGRA':'RGBA';
    }
    X.reset(); gpuReset(); const cv=$('cv'), t0=performance.now(); let blackRun=0, probes=0, litProbes=0;
    for(let f=0;f<nf;f++){
      if(job.cancel)throw new Error('cancelled'); if(encErr)throw encErr; if(mode==='gpu'&&!G.ok)throw new Error('GPU was lost during export');
      await seekMedia(f); frame(f);
      let lum=null;
      if(mode==='gpu'){
        await G.dev.queue.onSubmittedWorkDone();
        const ce=G.dev.createCommandEncoder();
        ce.copyTextureToBuffer({texture:G.off},{buffer:capBuf,bytesPerRow:capRow},[W,H]);
        G.dev.queue.submit([ce.finish()]);
        await capBuf.mapAsync(GPUMapMode.READ);
        const mapped=new Uint8Array(capBuf.getMappedRange());
        const copy=new Uint8Array(mapped.length); copy.set(mapped); capBuf.unmap();
        let sum=0,cnt=0;
        for(let i=0;i<copy.length;i+=4*97){sum+=copy[i]+copy[i+1]+copy[i+2];cnt++;}
        lum=cnt?sum/(cnt*3*255):0;
        if(capFmt==='BGRA')for(let i=0;i<copy.length;i+=4){const b=copy[i];copy[i]=copy[i+2];copy[i+2]=b;}
        const vf=new VideoFrame(copy,{format:'RGBA',codedWidth:W,codedHeight:H,
          timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS),layout:[{offset:0,stride:capRow}]});
        venc.encode(vf,{keyFrame:f%60===0}); vf.close();
      } else {
        if(f%3===0)await sleep(0);
        const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)}); venc.encode(vf,{keyFrame:f%60===0}); vf.close();
        lum=probeCpuLuma();
      }
      while(venc.encodeQueueSize>6)await sleep(2);
      if(f>0&&(f%15===0||f===nf-1)){
        probes++;
        if(lum!==null){ if(lum<0.002)blackRun++; else {blackRun=0;litProbes++;} }
        if(blackRun>=2)throw new Error('export is producing black frames (frame '+f+') - the canvas or the GPU is not delivering pixels');
      }
      if(f%10===0){const p=f/nf;btn.textContent=`■ Cancel ${Math.round(p*100)}%`;status(`exporting ${W}×${H} ${mp4?'mp4':'webm'} · frame ${f}/${nf}`+(f>30?` · about ${Math.ceil((performance.now()-t0)/1000*(1-p)/p)}s left`:''));pos=f/FPS;}
    }
    if(probes&&!litProbes)throw new Error('export produced only black frames ('+probes+' probes, none lit) - the canvas or the GPU is not delivering pixels');
    await venc.flush(); venc.close(); if(encErr)throw encErr;
    // A lost device can leave the encoder with zero chunks; never report "done · 0.0 MB".
    if(!vChunks||!vBytes)throw new Error('export produced no video data ('+vChunks+' chunks, '+vBytes+' bytes)');
    mux.finalize();
    const fileBytes=target.buffer?target.buffer.byteLength:0;
    if(!fileBytes)throw new Error('export produced an empty file (0 bytes)');
    lastBlob={blob:new Blob([target.buffer],{type:mp4?'video/mp4':'video/webm'}),ext:mp4?'mp4':'webm'};
    if(!lastBlob.blob.size)throw new Error('export produced an empty file (0-byte blob)');
    btn.textContent='⬇ Save video'; status(`export done · ${sizeLabel(lastBlob.blob.size)} ${lastBlob.ext}${ac||!abuf?'':' (no audio encoder here — video only)'} — press Save video`);
  }catch(e){ btn.textContent='⬇ Export video'; status(e.message==='cancelled'?'export cancelled':'Export failed: '+(e.message||e)); }
  finally{
    if(capBuf){try{capBuf.destroy();}catch(e){}}
    if(prevOff!==null){try{gpuAttach({offscreen:prevOff});gpuResize(W,H);}catch(e){}}
  }
  exporting=null; btn.classList.remove('on'); pos=0; refresh();
}
function startRec(){   // real-time fallback when the browser has no WebCodecs
  if(!window.MediaRecorder||!$('cv').captureStream){status('This browser cannot export or record video.');return;}
  pause();pos=0; const stream=$('cv').captureStream(FPS);let dest=null;
  if(abuf){dest=actx.createMediaStreamDestination();gain.connect(dest);stream.addTrack(dest.stream.getAudioTracks()[0]);}
  const mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  let rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:W>=1280?20e6:9e6,audioBitsPerSecond:256e3});}catch(e){status('Recording failed to start: '+e.message);return;}
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{if(dest)gain.disconnect(dest);lastBlob={blob:new Blob(chunks,{type:mime.split(';')[0]}),ext:mime.includes('mp4')?'mp4':'webm'};$('bExp').textContent='⬇ Save video';$('bExp').classList.remove('on');status(`recorded ${(lastBlob.blob.size/1e6).toFixed(1)} MB — press Save video`);};
  recording=rec;rec.start(1000);$('bExp').textContent='■ Stop recording';$('bExp').classList.add('on');status('recording in real time — keep this tab visible');play();
}
function stopRec(){const r=recording;recording=null;if(r&&r.state!=='inactive')r.stop();}
async function saveRec(){
  const name='moshloom.'+lastBlob.ext;
  try{ if(dlcap){await dlcap.save({filename:name,data:lastBlob.blob});status('saved');}
       else{const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob.blob);a.download=name;document.body.appendChild(a);a.click();a.remove();status('download started');}
       lastBlob=null;$('bExp').textContent='⬇ Export video';
  }catch(e){status(e&&e.code==='declined'?'Save declined — press Save video to try again.':'Could not save here ('+((e&&e.code)||e)+').');}
}
$('bExp').onclick=()=>{ if(exporting){exporting.cancel=true;if(renderIn==='worker'&&rw)rwCall('export-cancel',{}).catch(()=>{});} else if(recording){pause();} else if(lastBlob){saveRec();} else exportVideo(); };
$('bExp').oncontextmenu=e=>{e.preventDefault();if(lastBlob){lastBlob=null;$('bExp').textContent='⬇ Export video';status('export discarded');}};
boot();
</script>
